    <div class="container">
        <div class="row">
            <div class="col">
                <form>
                    
                    <div class="form" id="enroll">
                        <form>
                            <div style="font-size: xx-large; font-weight: bold;">Student Information</div>

                            <div class="row" id="student-info">
                                <div class="col">
                                    <label for="fname"style="font-weight: bold;">Student's First Name</label><br>
                                    <input type="text" placeholder="Name Here" class="form-control">
                                    <br><br>
                                </div>

                                <div class="col">
                                <label for="lname"style="font-weight: bold;">Student's Last Name</label><br>
                                <input type="text" placeholder="Name Here" class="form-control">
                                </div>
                            </div>
                            <br><br>

                            <div class="row">
                                <div class="col">
                                    <label for="bday" style="font-weight: bold;">Birth Date</label><br>
                                    <input type="date" class="form-select">
                                </div>

                                <div class="col">
                                <label for="gender" style="font-weight: bold;">Gender</label><br>
                                <select class="form-select">
                                    <option value="g1">Select</option>
                                    <option value="g2">Male</option>
                                    <option value="g3">Female</option>
                                    <option value="g4">Other</option>
                                </select>
                                </div>

                                <div class="col">
                                    <label for="Grade" style="font-weight: bold;">Grade Level</label><br>
                                <select class="form-select">
                                    <option value="gr1">Select</option>
                                    <option value="gr2">Casa</option>
                                    <option value="gr3">Grade School</option>
                                    <option value="gr4">Intermediate</option>
                                    <option value="gr5">Junior High School</option>
                                    <option value="gr6">Senior High School</option>
                                </select>
                                </div>
                            </div>
                            <br><br>

                            <div style="font-size: x-large; font-weight: bold;">Contact Details</div>

                            <div class="row" id="student-info">
                                <div class="col">
                                <label for="email"style="font-weight: bold;">Email:</label><br>
                                <input type="email" placeholder="example@gmail.com" class="form-control">
                                </div>

                                <div class="col">
                                <label for="contact"style="font-weight: bold;">Contact Number</label><br>
                                <input type="text" placeholder="xxxx-xxx-xxxx" class="form-control">
                                </div>
                            </div>
                            <br><br>

                            <div style="font-size: x-large; font-weight: bold;">Other Information</div>

                            <label for="mode" style="font-weight: bold;">Mode of Learning</label>
                            <br>
                            <input type="radio" id="mode1" name="mode">
                                <label for="rate1">Online</label>
                            <br>
                            <input type="radio" id="mode2" name="mode">
                                <label for="rate2">Face-to-Face</label>
                            <br><br>

                            <input type="Submit" id="submit"value="Submit">
